schema_version: 2

project:
  name: bento-order-app
  type: react-worker-d1-liff
  stack:
    - react
    - vite
    - worker
    - d1
    - liff

shared_source:
  repository: "agent-platform"
  ref: "v0.7.0"

shared_skills:
  - id: ap-safe-preflight
    version: "0.2.0"
    path: ".agents/skills/ap-safe-preflight"
  - id: ap-verification-core
    version: "0.4.0"
    path: ".agents/skills/ap-verification-core"

project_skills: []

commands:
  pii_scan:
    - "git diff --unified=0 origin/main | node scripts/pii-scan-public-artifacts.mjs --diff-stdin"
    - "git ls-files --others --exclude-standard | xargs -r node scripts/pii-scan-public-artifacts.mjs"
  setup:
    - "npm ci --cache /tmp/bento-order-app-npm-cache"
    - "npm ci --prefix worker-poc --cache /tmp/bento-order-app-npm-cache"
  test:
    - "node --test tests/strict-identity-ledger.test.cjs tests/changelog-migration.test.cjs"
    - "node worker-poc/tests/invalid-employee-repair.test.js && node worker-poc/tests/effective-order-item-name.test.js && node worker-poc/tests/line-binding-transfer.test.js && node worker-poc/tests/roles.test.js"
    - "npm test --prefix worker-poc"
    - "node --test tests/invalid-employee-repair-ui.test.cjs tests/effective-order-item-name-ui.test.cjs tests/line-binding-transfer-ui.test.cjs tests/order-statistics-ui.test.cjs tests/announcement-images-ui.test.cjs tests/local-mock-responsive-uat.test.cjs"
  lint:
    - "npm run lint"
  build:
    - "npm run build"

verification:
  required:
    - test
    - lint
    - build
  manual:
    - "Real LIFF authentication"
    - "View As and identity flow"
    - "Worker deployment and remote D1 production contract"
