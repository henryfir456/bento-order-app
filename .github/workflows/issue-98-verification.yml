name: Issue 98 footprints verification
on:
  pull_request:
    paths:
      - '.github/workflows/issue-98-verification.yml'
      - 'src/App.jsx'
      - 'src/api/apiClientCore.js'
      - 'src/components/BottomNavigation.jsx'
      - 'src/features/orders/MyBentoFootprintsPage.jsx'
      - 'src/data/changelog.js'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'worker-poc/src/domain/ordersRead.js'
      - 'worker-poc/src/routes/readOnly.js'
      - 'worker-poc/package.json'
      - 'worker-poc/tests/order-statistics.test.js'
      - 'tests/order-statistics-ui.test.cjs'
      - 'docs/retrospectives/2026-10-16-issue-98.md'
  push:
    paths:
      - '.github/workflows/issue-98-verification.yml'
      - 'src/App.jsx'
      - 'src/api/apiClientCore.js'
      - 'src/components/BottomNavigation.jsx'
      - 'src/features/orders/MyBentoFootprintsPage.jsx'
      - 'src/data/changelog.js'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'worker-poc/src/domain/ordersRead.js'
      - 'worker-poc/src/routes/readOnly.js'
      - 'worker-poc/package.json'
      - 'worker-poc/tests/order-statistics.test.js'
      - 'tests/order-statistics-ui.test.cjs'
      - 'docs/retrospectives/2026-10-16-issue-98.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/strict-identity-ledger.test.cjs
      - run: node --test tests/changelog-migration.test.cjs tests/order-statistics-ui.test.cjs
      - run: npm run lint
      - run: npm run build
      - run: npm ci --prefix worker-poc
      - run: npm test --prefix worker-poc
