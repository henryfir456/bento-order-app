name: Deploy production Worker from main
run-name: Deploy bento-api-poc from ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - 'worker-poc/**'
      - '.github/workflows/deploy-production-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bento-production-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker-poc/package-lock.json
      - name: Check Cloudflare deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - run: npm ci --prefix worker-poc
      - run: npm test --prefix worker-poc
      - name: Deploy from checked-out main source (preserving remote vars)
        working-directory: worker-poc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc --keep-vars
      - name: Verify Worker deployment and read-only production contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const script = 'bento-api-poc';
          const origin = 'https://stirring-pony-3571ac.netlify.app';
          const base = 'https://bento-api-poc.henryfir456.workers.dev';
          const deployments = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script}/deployments`, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` }
          });
          assert.equal(deployments.status, 200, 'Cloudflare deployment read must succeed');
          const payload = await deployments.json();
          assert.equal(payload.success, true);
          const latest = payload.result?.deployments?.[0];
          assert.ok(latest?.id, 'Deployment ID required');
          assert.equal(latest.versions?.length, 1, 'Exactly one live version expected');
          assert.equal(Number(latest.versions[0]?.percentage), 100, 'Worker must receive 100% traffic');
          assert.ok(latest.versions[0]?.version_id, 'Worker Version ID required');
          console.log('main SHA:', process.env.GITHUB_SHA);
          console.log('Deployment ID:', latest.id);
          console.log('Worker Version ID:', latest.versions[0].version_id);
          console.log('Traffic:', latest.versions[0].percentage + '%');
          const health = await fetch(base + '/api/health');
          assert.equal(health.status, 200, 'Production health must succeed');
          assert.equal((await health.json()).database, true, 'D1 must be reachable');
          const cors = await fetch(base + '/api/me', {
            method: 'OPTIONS',
            headers: { Origin: origin, 'Access-Control-Request-Method': 'GET' }
          });
          assert.equal(cors.status, 204);
          assert.equal(cors.headers.get('access-control-allow-origin'), origin);
          const badCors = await fetch(base + '/api/me', {
            method: 'OPTIONS',
            headers: { Origin: 'https://untrusted.example', 'Access-Control-Request-Method': 'GET' }
          });
          assert.equal(badCors.headers.get('access-control-allow-origin'), null);
          const noAuth = await fetch(base + '/api/orders/history');
          assert.ok([401, 403].includes(noAuth.status), 'Order history must reject anonymous requests');
          console.log('Read-only health, authorization and CORS smoke: PASS');
          NODE
      - name: Record deployed source
        run: echo "Deployed GitHub main commit $GITHUB_SHA"
