name: Frontend browser performance baseline
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/measure-build-assets.mjs'
      - '.github/workflows/frontend-browser-performance.yml'
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build PR with mock user (no production credentials)
        env:
          VITE_AUTH_MODE: mock
          VITE_MOCK_USER: user
        run: |
          npm ci
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview-pr.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Build base in isolated worktree
        env:
          VITE_AUTH_MODE: mock
          VITE_MOCK_USER: user
        run: |
          git worktree add --detach /tmp/bento-perf-base ${{ github.event.pull_request.base.sha }}
          cd /tmp/bento-perf-base
          npm ci
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/preview-base.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4174/ >/dev/null
      - name: Lighthouse headless Chrome (single run per revision)
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4174/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet --output=json --output-path=/tmp/lh-before.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet --output=json --output-path=/tmp/lh-after.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const read = f => JSON.parse(fs.readFileSync(f));
            const extract = x => Object.fromEntries(['first-contentful-paint','largest-contentful-paint','cumulative-layout-shift','total-blocking-time','speed-index'].map(k => [k, x.audits[k]?.numericValue ?? null]));
            console.log(JSON.stringify({environment:'CI headless Chrome, mock user, one Lighthouse run per revision, no real LIFF',before:extract(read('/tmp/lh-before.json')),after:extract(read('/tmp/lh-after.json'))},null,2));
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-performance-lighthouse
          path: /tmp/lh-*.json
          if-no-files-found: ignore
