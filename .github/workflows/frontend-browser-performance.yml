name: Frontend browser performance baseline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/frontend-browser-performance.yml'
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build PR with mock user (no production credentials)
        env:
          VITE_AUTH_MODE: mock
          VITE_MOCK_USER: user
        run: |
          npm ci
          npm run build
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/preview-pr.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Build base in isolated worktree
        env:
          VITE_AUTH_MODE: mock
          VITE_MOCK_USER: user
        run: |
          git worktree add --detach /tmp/bento-perf-base "${{ github.event.pull_request.base.sha || 'main' }}"
          cd /tmp/bento-perf-base
          npm ci
          npm run build
          npm run dev -- --host 127.0.0.1 --port 4174 > /tmp/preview-base.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4174/ >/dev/null
      - name: Lighthouse repeated headless Chrome mock measurements (3 pairs)
        run: |
          for iteration in 1 2 3; do
            npx --yes lighthouse@12.8.2 http://127.0.0.1:4174/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet --output=json --output-path="/tmp/lh-before-${iteration}.json"
            npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet --output=json --output-path="/tmp/lh-after-${iteration}.json"
          done
          node --input-type=module -e "
            import fs from 'node:fs';
            const keys = ['first-contentful-paint','largest-contentful-paint','cumulative-layout-shift','total-blocking-time','speed-index'];
            const samples = side => [1,2,3].map(i => JSON.parse(fs.readFileSync('/tmp/lh-' + side + '-' + i + '.json')));
            const metrics = data => Object.fromEntries(keys.map(key => {
              const values = data.map(report => report.audits[key]?.numericValue ?? null);
              const valid = values.every(v => Number.isFinite(v));
              return [key, { samples: values, median: valid ? [...values].sort((a,b) => a-b)[1] : null }];
            }));
            console.log(JSON.stringify({environment:'CI headless Chrome, Vite dev-mode mock, 3 independent runs per revision, not real LIFF or production bundle',before:metrics(samples('before')),after:metrics(samples('after'))},null,2));
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-performance-lighthouse
          path: /tmp/lh-*.json
          if-no-files-found: ignore
