name: Dual calendar UI verification
on:
  pull_request:
    paths:
      - 'src/App.jsx'
      - 'src/features/calendar/**'
      - 'src/components/BottomNavigation.jsx'
      - 'src/features/orders/MyOrdersPage.jsx'
      - 'src/features/balances/WalletPage.jsx'
      - 'tests/bottom-navigation-v01524.test.cjs'
      - 'tests/dual-calendar-ui.test.cjs'
      - 'tests/modern-calendar-v01520.test.cjs'
      - 'tests/user-center-compact-v01521.test.cjs'
      - 'tests/user-center-v01522.test.cjs'
      - 'tests/admin-return-modal-v01523.test.cjs'
      - 'src/components/IdentityStatusBadges.jsx'
      - 'src/features/balances/MemberBalanceManagement.jsx'
      - 'src/api/apiClientCore.js'
      - 'worker-poc/src/routes/admin.js'
      - 'src/data/changelog.js'
      - 'CHANGELOG.md'
      - 'package*.json'
      - '.github/workflows/dual-calendar-ui.yml'
  push:
    branches: [main]
    paths:
      - 'src/App.jsx'
      - 'src/features/calendar/**'
      - 'src/components/BottomNavigation.jsx'
      - 'src/features/orders/MyOrdersPage.jsx'
      - 'src/features/balances/WalletPage.jsx'
      - 'tests/bottom-navigation-v01524.test.cjs'
      - 'tests/dual-calendar-ui.test.cjs'
      - 'tests/modern-calendar-v01520.test.cjs'
      - 'tests/user-center-compact-v01521.test.cjs'
      - 'tests/user-center-v01522.test.cjs'
      - 'tests/admin-return-modal-v01523.test.cjs'
      - 'src/components/IdentityStatusBadges.jsx'
      - 'src/features/balances/MemberBalanceManagement.jsx'
      - 'src/api/apiClientCore.js'
      - 'worker-poc/src/routes/admin.js'
      - 'src/data/changelog.js'
      - 'CHANGELOG.md'
      - 'package*.json'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/dual-calendar-ui.test.cjs tests/modern-calendar-v01520.test.cjs tests/user-center-compact-v01521.test.cjs tests/user-center-v01522.test.cjs tests/admin-return-modal-v01523.test.cjs tests/bottom-navigation-v01524.test.cjs
      - run: node --test tests/changelog-migration.test.cjs
      - run: npm run lint
      - run: npm run build
      - name: Measure built JS and CSS sizes (raw and gzip)
        run: node scripts/measure-build-assets.mjs
      - name: Compare baseline main build assets
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add --detach /tmp/bento-base "${{ github.event.pull_request.base.sha }}"
          cd /tmp/bento-base
          npm ci
          npm run build
          mkdir -p scripts
          cp "$GITHUB_WORKSPACE/scripts/measure-build-assets.mjs" scripts/measure-build-assets.mjs
          node scripts/measure-build-assets.mjs
