name: Menu variant regression
on:
  push:
    branches: [codex/issue-41-menu-variant]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Required identity tests
        run: node --test tests/strict-identity-ledger.test.cjs
      - name: Menu UI regression
        run: node --test tests/menu-item-changes-ui.test.cjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Worker menu contracts
        working-directory: worker-poc
        run: node --test tests/menu-item-changes.test.js tests/menu-vendor-isolation.test.js
