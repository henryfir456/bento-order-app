name: Menu variant regression
on:
  push:
    branches: [main, codex/issue-41-menu-variant]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Required identity tests
        run: node --test tests/strict-identity-ledger.test.cjs
      - name: Android LIFF auth recovery regression
        if: ${{ !cancelled() }}
        run: node --test tests/auth-startup-recovery.test.cjs
      - name: Changelog translation coverage
        if: ${{ !cancelled() }}
        run: node --test tests/changelog-migration.test.cjs
      - name: Menu UI regression
        if: ${{ !cancelled() }}
        run: node --test tests/menu-item-changes-ui.test.cjs
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Draft helper type check
        if: ${{ !cancelled() }}
        run: npx --yes --package typescript@5.9.3 tsc --allowJs --checkJs --noEmit --target es2022 --module esnext --moduleResolution bundler src/features/admin/menuItemChangesDraft.js
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Ledger month and cross-month refund regression
        if: ${{ !cancelled() }}
        working-directory: worker-poc
        run: node --test tests/balance-history.test.js
      - name: Full Worker regression suite before backend release
        if: ${{ !cancelled() }}
        working-directory: worker-poc
        run: npm test
      - name: Synthetic SQLite ledger detail benchmark
        if: ${{ !cancelled() }}
        working-directory: worker-poc
        run: node scripts/benchmark-ledger-order-details.mjs
      - name: Worker menu contracts
        if: ${{ !cancelled() }}
        working-directory: worker-poc
        run: node --test tests/menu-item-changes.test.js tests/menu-vendor-isolation.test.js
