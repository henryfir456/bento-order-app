  <style>
    /* 強制隱藏 Netlify 注入的 Badge */
    .nl-wrap,
    #nl-card,
    #nl-badge,
    section[aria-label*="Netlify"],
    button[aria-label*="Netlify"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      height: 0 !important;
      width: 0 !important;
      overflow: hidden !important;
    }
  </style>
