  <!-- 強制消除 Netlify 注入標籤 -->
  <style>
    html body .nl-wrap,
    html body #nl-card,
    html body #nl-badge,
    html body [class*="nl-wrap"],
    html body [id*="nl-"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      clip: rect(0, 0, 0, 0) !important;
      height: 0 !important;
      width: 0 !important;
      position: absolute !important;
      left: -9999px !important;
    }
  </style>
</head>
